[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beauty-ai-wrappers"
version = "0.1.0"
description = "Reference text and internal image API wrappers for the cosmetics MVP"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "httpx>=0.27,<1", "openai>=2,<4", "Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
inference = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
models = ["torch==2.14.1", "torchvision==0.29.1", "transformers==5.20.2", "timm==1.0.30", "kornia==0.8.3", "einops==0.8.2", "numpy==2.4.6"]
background = ["torch==2.14.1", "transformers==5.20.2", "numpy==2.4.6", "diffusers==0.41.0", "accelerate==1.15.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["beauty_ai*"]
